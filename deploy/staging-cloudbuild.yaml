steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_ANALYTICS_API_BASE_URL=https://analytics-staging.naturalyield.com.au
      - --build-arg
      - VITE_WORDPRESS_BASE_URL=https://staging.naturalyield.com.au
      - --tag
      - australia-southeast1-docker.pkg.dev/natural-yield-analytics-stg/woo-analytics-staging/woo-analytics-app:${_GIT_REF}
      - .
images:
  - australia-southeast1-docker.pkg.dev/natural-yield-analytics-stg/woo-analytics-staging/woo-analytics-app:${_GIT_REF}
substitutions:
  _GIT_REF: unknown
options:
  logging: CLOUD_LOGGING_ONLY
